name: Release

# Two ways to publish a release:
#   1. Push a tag:   git tag v0.2.0 && git push origin v0.2.0
#   2. Actions tab → Release → Run workflow, enter the tag (e.g. v0.2.0).
#      The tag is created on the chosen branch if it does not exist.
# Running by hand with an empty tag builds the artifacts without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app (universal)
    runs-on: macos-26
    env:
      # `secrets` cannot be used in step-level `if`, so surface presence here.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Apple Silicon and Intel binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Make universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/speedcraft \
            target/x86_64-apple-darwin/release/speedcraft \
            -output dist/speedcraft
          lipo -info dist/speedcraft
          dist/speedcraft --version
      - name: Import signing certificate (optional)
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          echo "SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | awk -F'"' 'NR==1{print $2}')" >> "$GITHUB_ENV"
      - name: Build Speedcraft.app
        env:
          SPEEDCRAFT_BIN: dist/speedcraft
        run: ./install/make-mac-app.sh
      - name: Notarize (optional)
        if: env.SIGN_IDENTITY != '' && env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Speedcraft.app dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Speedcraft.app
      - name: Package
        run: |
          VERSION=$(dist/speedcraft --version | awk '{print $2}')
          cd dist
          ditto -c -k --keepParent Speedcraft.app "Speedcraft-${VERSION}-macos.app.zip"
          tar -czf "speedcraft-${VERSION}-macos-universal.tar.gz" speedcraft
          shasum -a 256 *.zip *.tar.gz > "SHA256SUMS-macos.txt"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS-macos.txt

  linux:
    name: Linux agent (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          VERSION=$(target/release/speedcraft --version | awk '{print $2}')
          mkdir -p dist
          cp target/release/speedcraft dist/
          cp install/install-agent.sh dist/
          cd dist
          tar -czf "speedcraft-${VERSION}-linux-${{ matrix.arch }}.tar.gz" speedcraft install-agent.sh
          sha256sum *.tar.gz > "SHA256SUMS-linux-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt

  release:
    name: Publish release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          body: |
            ## Install

            **macOS (Apple Silicon and Intel):** download `Speedcraft-*-macos.app.zip`, unzip, move `Speedcraft.app` to Applications. The app is not notarized unless the maintainer has configured signing secrets, so on first launch either right-click → Open, or run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Speedcraft.app
            ```

            It opens a Terminal window with the logs and the control panel in your browser at http://127.0.0.1:7700. Read `docs/START_HERE.md` first.

            **Linux agent (VM or server):** one command, which downloads the matching binary from this release:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/cjsmitty/speedcraft/main/install/install-agent.sh | bash
            ```

            Verify downloads against `SHA256SUMS.txt`.
